project:
  type: website
  # g: the docs are built from examples/ into _docs/ at the repository root
  output-dir: ../_docs
  # g: the notebooks are rendered with their saved outputs (not executed)
  render:
    - index.ipynb
    - 00_utils.ipynb
    - 01_data.ipynb
    - 02_graph.ipynb
    - 03_hypergraph.ipynb
    - 04_io.ipynb
  # g: interactive plots embedded by index.ipynb
  resources:
    - outputs
  preview:
    port: 3000
    browser: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4

website:
  title: "parag"
  site-url: "https://rraadd88.github.io/parag"
  description: "Para (beyond) Graph: interpretable representations of (pairwise) graphs"
  twitter-card: true
  open-graph: true
  repo-branch: master
  repo-url: "https://github.com/rraadd88/parag"
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: "https://github.com/rraadd88/parag"
  sidebar:
    style: "floating"
    contents:
      - index.ipynb
      - 00_utils.ipynb
      - 01_data.ipynb
      - 02_graph.ipynb
      - 03_hypergraph.ipynb
      - 04_io.ipynb
