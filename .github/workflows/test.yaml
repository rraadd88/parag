name: CI
on:  [workflow_dispatch, pull_request, push]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # g: blocking; rules are set in pyproject.toml ([tool.ruff.lint])
      - name: ruff
        run: uvx ruff@0.17.2 check parag tests

  test:
    runs-on: ubuntu-latest
    # g: the current and a newer stable Python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install
        run: uv pip install -e ".[dev]"

      # g: unit tests and the tutorial notebooks (tests/test_notebooks.py)
      - name: Test
        run: pytest
